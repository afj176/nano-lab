<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0d10">
  <title>Nano Lab — small models in your browser</title>
  <meta name="description" content="Run small text, speech, transcription, image and video models locally in your browser. No server, no API key: compare speed and quality for yourself.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nano Lab — small models in your browser">
  <meta property="og:description" content="Run small text, speech, transcription, image and video models locally in your browser. No server, no API key.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>
    // set the theme before first paint to avoid a flash
    try {
      var s = JSON.parse(localStorage.getItem('nano-settings')) || {};
      var t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.accent = s.accent || 'iris';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Nano Lab needs JavaScript and a current Chromium-based browser.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
